name: jackproof LLMjacking scan
description: Report LLM credential and model-service risk that a pull request adds, comment the result once, and upload SARIF to code scanning.
branding:
  icon: shield
  color: gray-dark
inputs:
  version:
    description: Version of jackproof to install, for example v1.0.1, or latest.
    default: latest
  fail-on:
    description: Lowest severity that fails the job when strict is true.
    default: high
  strict:
    description: Fail the job when the pull request adds a finding at or above fail-on.
    default: "false"
  comment:
    description: Post or update one pull request comment with the new findings.
    default: "true"
  upload-sarif:
    description: Upload the SARIF report of the head revision to code scanning.
    default: "true"
  github-token:
    description: Token used to post the comment. It needs the pull-requests write permission.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - name: Install jackproof
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: go install "github.com/ryankshah/jackproof/cmd/jackproof@${VERSION}"
    - name: Fetch the base revision
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: git fetch --no-tags --depth=1 origin "${BASE_SHA}"
    - name: Compare findings between base and head
      id: diff
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        status=0
        "$(go env GOPATH)/bin/jackproof" diff --format md --fail-on "${FAIL_ON}" "${BASE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/jackproof-comment.md" || status=$?
        echo "status=${status}" >> "${GITHUB_OUTPUT}"
    - name: Build the SARIF report
      if: inputs.upload-sarif == 'true'
      shell: bash
      run: |
        "$(go env GOPATH)/bin/jackproof" scan --format sarif --fail-on critical . > "${RUNNER_TEMP}/jackproof.sarif" || test $? -eq 1
    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/jackproof.sarif
        category: jackproof
    - name: Post the pull request comment
      if: inputs.comment == 'true' && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash "${{ github.action_path }}/scripts/pr-comment.sh" "${RUNNER_TEMP}/jackproof-comment.md"
    - name: Apply the result
      shell: bash
      env:
        STATUS: ${{ steps.diff.outputs.status }}
        STRICT: ${{ inputs.strict }}
      run: |
        if [ "${STATUS}" = "2" ]; then
          echo "jackproof failed to run" >&2
          exit 1
        fi
        if [ "${STATUS}" = "1" ] && [ "${STRICT}" = "true" ]; then
          echo "The pull request adds findings at or above the fail-on severity" >&2
          exit 1
        fi
