- id: huggingface
  name: Hugging Face
  env_vars: [HF_TOKEN, HUGGING_FACE_HUB_TOKEN, HUGGINGFACEHUB_API_TOKEN]
  refs: [https://huggingface.co/docs/hub/security-tokens]
  aliases: [hf]
  reach: Whatever the token scopes allow on the owning account, which can include inference billed to that account.
  verify:
    url: https://huggingface.co/api/whoami-v2
    auth: bearer
    verified: false
  formats:
    - name: access-token
      pattern: 'hf_[A-Za-z0-9]{30,}'
      verified: false

- id: replicate
  name: Replicate
  env_vars: [REPLICATE_API_TOKEN]
  refs: [https://replicate.com/docs/reference/http]
  reach: Model runs billed to the Replicate account that owns the token.
  verify:
    url: https://api.replicate.com/v1/account
    auth: bearer
    verified: false
  formats:
    - name: api-token
      pattern: 'r8_[A-Za-z0-9]{30,}'
      verified: false

- id: perplexity
  name: Perplexity
  env_vars: [PERPLEXITY_API_KEY]
  refs: [https://docs.perplexity.ai/guides/getting-started]
  reach: API requests billed to the Perplexity account that owns the key.
  formats:
    - name: api-key
      pattern: 'pplx-[A-Za-z0-9]{30,}'
      verified: false

- id: aws
  name: AWS
  env_vars: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
  refs: [https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html]
  aliases: [bedrock]
  reach: Actions allowed by the IAM identity that owns the key. If that identity can call Bedrock, the holder gets model invocation billed to the AWS account.
  formats:
    - name: access-key-id
      pattern: '(?:AKIA|ASIA)[0-9A-Z]{16}'
      anchors: [AKIA, ASIA]
      verified: true
    - name: secret-access-key
      pattern: '[A-Za-z0-9/+]{40}'
      context: true
      verified: false

- id: gcp
  name: Google Cloud
  env_vars: [GOOGLE_APPLICATION_CREDENTIALS]
  refs: [https://cloud.google.com/iam/docs/keys-create-delete]
  aliases: [vertex, vertexai, googlecloud]
  reach: Actions allowed by the service account. If it holds Vertex AI permissions, the holder gets model invocation billed to the project.
  formats:
    - name: service-account-private-key
      pattern: '"private_key"\s*:\s*"-----BEGIN [A-Z ]*PRIVATE KEY-----[^"]{20,}"'
      verified: true

- id: azure-openai
  name: Azure OpenAI
  env_vars: [AZURE_OPENAI_API_KEY, AZURE_OPENAI_KEY]
  refs: [https://learn.microsoft.com/en-us/azure/ai-services/openai/reference]
  aliases: [aoai]
  reach: Deployments on the Azure OpenAI resource that issued the key, billed to its subscription.
  formats:
    - name: api-key
      pattern: '[A-Za-z0-9]{32}'
      context: true
      verified: false
