- id: openai
  name: OpenAI
  env_vars: [OPENAI_API_KEY]
  refs: [https://platform.openai.com/docs/api-reference/authentication]
  formats:
    - name: project-key
      pattern: 'sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,}'
      verified: false
    - name: legacy-key
      pattern: 'sk-[A-Za-z0-9]{40,}'
      verified: false

- id: anthropic
  name: Anthropic
  env_vars: [ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN]
  refs: [https://docs.anthropic.com/en/api/getting-started]
  formats:
    - name: api-key
      pattern: 'sk-ant-[A-Za-z0-9_-]{20,}'
      verified: false

- id: google-ai-studio
  name: Google AI Studio (Gemini API)
  env_vars: [GEMINI_API_KEY, GOOGLE_API_KEY]
  refs: [https://ai.google.dev/gemini-api/docs/api-key]
  formats:
    - name: api-key
      pattern: 'AIza[0-9A-Za-z_-]{35}'
      verified: false

- id: fireworks
  name: Fireworks
  env_vars: [FIREWORKS_API_KEY]
  refs: [https://docs.fireworks.ai/api-reference/introduction]
  formats:
    - name: api-key
      pattern: 'fw_[A-Za-z0-9]{20,}'
      verified: false

- id: together
  name: Together
  env_vars: [TOGETHER_API_KEY]
  refs: [https://docs.together.ai/docs/quickstart]
  formats:
    - name: api-key
      pattern: '[a-f0-9]{64}'
      context: true
      verified: false

- id: groq
  name: Groq
  env_vars: [GROQ_API_KEY]
  refs: [https://console.groq.com/docs/quickstart]
  formats:
    - name: api-key
      pattern: 'gsk_[A-Za-z0-9]{40,}'
      verified: false

- id: mistral
  name: Mistral
  env_vars: [MISTRAL_API_KEY]
  refs: [https://docs.mistral.ai/getting-started/quickstart/]
  formats:
    - name: api-key
      pattern: '[A-Za-z0-9]{32}'
      context: true
      verified: false

- id: cohere
  name: Cohere
  env_vars: [COHERE_API_KEY, CO_API_KEY]
  refs: [https://docs.cohere.com/docs/api-keys]
  formats:
    - name: api-key
      pattern: '[A-Za-z0-9]{40}'
      context: true
      verified: false

- id: openrouter
  name: OpenRouter
  env_vars: [OPENROUTER_API_KEY]
  refs: [https://openrouter.ai/docs/api-reference/authentication]
  formats:
    - name: api-key
      pattern: 'sk-or-v1-[a-f0-9]{64}'
      verified: false

- id: xai
  name: xAI
  env_vars: [XAI_API_KEY]
  refs: [https://docs.x.ai/docs/overview]
  formats:
    - name: api-key
      pattern: 'xai-[A-Za-z0-9]{40,}'
      verified: false

- id: deepseek
  name: DeepSeek
  env_vars: [DEEPSEEK_API_KEY]
  refs: [https://api-docs.deepseek.com/]
  formats:
    - name: api-key
      pattern: 'sk-[a-f0-9]{32}'
      context: true
      verified: false

- id: huggingface
  name: Hugging Face
  env_vars: [HF_TOKEN, HUGGING_FACE_HUB_TOKEN, HUGGINGFACEHUB_API_TOKEN]
  refs: [https://huggingface.co/docs/hub/security-tokens]
  formats:
    - name: access-token
      pattern: 'hf_[A-Za-z0-9]{30,}'
      verified: false

- id: replicate
  name: Replicate
  env_vars: [REPLICATE_API_TOKEN]
  refs: [https://replicate.com/docs/reference/http]
  formats:
    - name: api-token
      pattern: 'r8_[A-Za-z0-9]{30,}'
      verified: false

- id: perplexity
  name: Perplexity
  env_vars: [PERPLEXITY_API_KEY]
  refs: [https://docs.perplexity.ai/guides/getting-started]
  formats:
    - name: api-key
      pattern: 'pplx-[A-Za-z0-9]{30,}'
      verified: false

- id: aws
  name: AWS
  env_vars: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
  refs: [https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html]
  formats:
    - name: access-key-id
      pattern: '(?:AKIA|ASIA)[0-9A-Z]{16}'
      verified: true
    - name: secret-access-key
      pattern: '[A-Za-z0-9/+]{40}'
      context: true
      verified: false

- id: gcp
  name: Google Cloud
  env_vars: []
  refs: [https://cloud.google.com/iam/docs/keys-create-delete]
  formats:
    - name: service-account-private-key
      pattern: '"private_key"\s*:\s*"-----BEGIN [A-Z ]*PRIVATE KEY-----[^"]{20,}"'
      verified: false

- id: azure-openai
  name: Azure OpenAI
  env_vars: [AZURE_OPENAI_API_KEY, AZURE_OPENAI_KEY]
  refs: [https://learn.microsoft.com/en-us/azure/ai-services/openai/reference]
  formats:
    - name: api-key
      pattern: '[A-Za-z0-9]{32}'
      context: true
      verified: false
