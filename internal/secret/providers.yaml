- id: openai
  name: OpenAI
  env_vars: [OPENAI_API_KEY]
  refs: [https://platform.openai.com/docs/api-reference/authentication]
  reach: Model inference billed to the OpenAI organization or project that owns the key.
  verify:
    url: https://api.openai.com/v1/models
    auth: bearer
    verified: true
  formats:
    - name: project-key
      pattern: 'sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,}'
      verified: false
    - name: legacy-key
      pattern: 'sk-[A-Za-z0-9]{40,}'
      verified: false

- id: anthropic
  name: Anthropic
  env_vars: [ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN]
  refs: [https://docs.anthropic.com/en/api/getting-started]
  reach: Model inference billed to the Anthropic workspace or organization that owns the key.
  verify:
    url: https://api.anthropic.com/v1/models
    auth: header:x-api-key
    headers: {anthropic-version: "2023-06-01"}
    verified: true
  formats:
    - name: api-key
      pattern: 'sk-ant-[A-Za-z0-9_-]{20,}'
      verified: false

- id: google-ai-studio
  name: Google AI Studio (Gemini API)
  env_vars: [GEMINI_API_KEY, GOOGLE_API_KEY]
  refs: [https://ai.google.dev/gemini-api/docs/api-key]
  aliases: [gemini, genai]
  reach: Gemini API calls billed to the Google Cloud project that owns the key.
  verify:
    url: https://generativelanguage.googleapis.com/v1beta/models
    auth: query:key
    rejected: [400]
    verified: false
  formats:
    - name: api-key
      pattern: 'AIza[0-9A-Za-z_-]{35}'
      verified: false

- id: fireworks
  name: Fireworks
  env_vars: [FIREWORKS_API_KEY]
  refs: [https://docs.fireworks.ai/api-reference/introduction]
  reach: Model inference billed to the Fireworks account that owns the key.
  verify:
    url: https://api.fireworks.ai/inference/v1/models
    auth: bearer
    verified: false
  formats:
    - name: api-key
      pattern: 'fw_[A-Za-z0-9]{20,}'
      verified: false

