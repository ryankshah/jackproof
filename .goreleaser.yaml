version: 2
project_name: jackproof

before:
  hooks:
    - go mod tidy

builds:
  - id: jackproof
    main: ./cmd/jackproof
    binary: jackproof
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: archives
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  draft: true

brews:
  - name: jackproof
    repository:
      owner: ryankshah
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/ryankshah/jackproof
    description: Find, score, detect and respond to LLMjacking risk.
    license: Apache-2.0
    test: |
      system "#{bin}/jackproof", "version"
