id: JP-KEY-001
title: Literal LLM provider key found in repository
severity: high
verified: false
matcher: provider-key-literal
description: A string in a file of the scanned tree matches the key format of an LLM provider or a cloud credential that can reach model services. Where git tracks the file, anyone with read access to the repository, its forks or its history can use the key. Where git ignores the file, the key is on this machine only, and the finding is low severity.
remediation: Revoke the key at the provider, create a replacement, store it in a secret manager and inject it at runtime. Removing the line from the file does not remove it from git history.
refs:
  - https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning
