id: JP-KEY-021
title: Credential passed as a plain environment variable to a job with a shared log or telemetry sink
severity: medium
verified: true
matcher: credential-env-with-shared-sink
description: A credential is placed in the process environment of a workload whose output or diagnostics leave the workload. Environment dumps, debug output and crash reports can carry the value to CI logs or a third-party service.
remediation: Pass the credential through a mechanism that does not put it in the process environment, such as a mounted secret file or a secret-manager call at the point of use. Remove environment dumps and debug tracing from jobs that hold credentials.
refs:
  - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions
